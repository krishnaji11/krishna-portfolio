<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background & Glass Gradients -->
    <linearGradient id="isfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="450" rx="16" fill="url(#isfBg)"/>

  <!-- Top App Window Bar -->
  <rect width="800" height="38" rx="16" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect y="20" width="800" height="18" fill="#0f172a"/>
  
  <!-- Window Dots -->
  <circle cx="24" cy="19" r="5" fill="#ef4444"/>
  <circle cx="42" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="19" r="5" fill="#10b981"/>
  
  <text x="400" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="600">
    I Service Force (ISF) — Field Service Operations &amp; Live Dispatch Center
  </text>
  
  <g transform="translate(710, 11)">
    <rect width="66" height="17" rx="8" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <circle cx="10" cy="8.5" r="3" fill="#10b981"/>
    <text x="20" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#34d399" font-weight="700">LIVE GPS</text>
  </g>

  <!-- Left Mini Sidebar -->
  <g transform="translate(0, 38)">
    <rect width="56" height="412" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <!-- Icons -->
    <rect x="14" y="20" width="28" height="28" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.2"/>
    <path d="M22,34 L28,26 L34,34 Z" fill="#38bdf8"/>
    
    <rect x="16" y="65" width="24" height="24" rx="5" fill="rgba(255,255,255,0.04)"/>
    <circle cx="28" cy="77" r="5" stroke="#64748b" stroke-width="1.5" fill="none"/>
    
    <rect x="16" y="105" width="24" height="24" rx="5" fill="rgba(255,255,255,0.04)"/>
    <rect x="22" y="112" width="12" height="10" rx="1.5" stroke="#64748b" stroke-width="1.5" fill="none"/>

    <rect x="16" y="145" width="24" height="24" rx="5" fill="rgba(255,255,255,0.04)"/>
    <line x1="22" y1="157" x2="34" y2="157" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Top Metric KPI Cards Bar -->
  <g transform="translate(70, 52)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="168" height="64" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" font-weight="500">ACTIVE FIELD TECHS</text>
    <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="22" fill="#38bdf8" font-weight="800">48 / 52</text>
    <circle cx="145" cy="32" r="10" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="145" y="36" font-family="sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">📍</text>

    <!-- KPI 2 -->
    <rect x="180" y="0" width="168" height="64" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="194" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" font-weight="500">DISPATCHED JOBS</text>
    <text x="194" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="22" fill="#34d399" font-weight="800">142</text>
    <circle cx="325" cy="32" r="10" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="325" y="36" font-family="sans-serif" font-size="11" fill="#34d399" text-anchor="middle">⚡</text>

    <!-- KPI 3 -->
    <rect x="360" y="0" width="168" height="64" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="374" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" font-weight="500">SLA RESOLUTION</text>
    <text x="374" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="22" fill="#fbbf24" font-weight="800">98.4%</text>
    <circle cx="505" cy="32" r="10" fill="rgba(251, 191, 36, 0.15)"/>
    <text x="505" y="36" font-family="sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">🎯</text>

    <!-- KPI 4 -->
    <rect x="540" y="0" width="175" height="64" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="554" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" font-weight="500">INVOICES GENERATED</text>
    <text x="554" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="22" fill="#c084fc" font-weight="800">₹3.84L</text>
    <circle cx="690" cy="32" r="10" fill="rgba(168, 85, 247, 0.15)"/>
    <text x="690" y="36" font-family="sans-serif" font-size="11" fill="#c084fc" text-anchor="middle">💳</text>
  </g>

  <!-- Main Work Area: Left GPS Live Radar Map (430px wide) -->
  <g transform="translate(70, 128)">
    <rect width="445" height="305" rx="12" fill="#080d1a" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
    
    <!-- Stylized Dark Map Grid / Roads -->
    <g opacity="0.18" stroke="#38bdf8" stroke-width="1.2">
      <line x1="0" y1="60" x2="445" y2="60"/>
      <line x1="0" y1="140" x2="445" y2="140"/>
      <line x1="0" y1="220" x2="445" y2="220"/>
      <line x1="100" y1="0" x2="100" y2="305"/>
      <line x1="220" y1="0" x2="220" y2="305"/>
      <line x1="340" y1="0" x2="340" y2="305"/>
    </g>

    <!-- Map Curved Arterials -->
    <path d="M40,290 Q150,210 220,160 T390,70" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
    <path d="M30,50 Q180,100 280,240 T420,280" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>

    <!-- Active Route 1 (Cyan Glowing Polyline) -->
    <path d="M80,230 L160,180 L230,195 L310,110 L370,95" fill="none" stroke="url(#routeGrad)" stroke-width="3.5" stroke-dasharray="6,4" filter="url(#glowCyan)"/>
    
    <!-- Dispatch Radar Center Pulse -->
    <circle cx="230" cy="195" r="45" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
    <circle cx="230" cy="195" r="75" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.2"/>

    <!-- Technician Marker 1 (Arjun - In Transit) -->
    <g transform="translate(370, 95)">
      <circle cx="0" cy="0" r="14" fill="rgba(56, 189, 248, 0.25)" filter="url(#glowCyan)"/>
      <circle cx="0" cy="0" r="7" fill="#38bdf8"/>
      <!-- Pill Label -->
      <rect x="12" y="-12" width="112" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="18" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fff" font-weight="700">Tech #04: Vikram</text>
      <text x="96" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#38bdf8">EN ROUTE</text>
    </g>

    <!-- Technician Marker 2 (On Site) -->
    <g transform="translate(120, 90)">
      <circle cx="0" cy="0" r="14" fill="rgba(16, 185, 129, 0.25)" filter="url(#glowGreen)"/>
      <circle cx="0" cy="0" r="7" fill="#10b981"/>
      <!-- Pill Label -->
      <rect x="12" y="-12" width="110" height="24" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="18" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fff" font-weight="700">Tech #12: Arjun</text>
      <text x="92" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#10b981">ON SITE</text>
    </g>

    <!-- Technician Marker 3 (Available) -->
    <g transform="translate(260, 240)">
      <circle cx="0" cy="0" r="6" fill="#fbbf24"/>
      <rect x="12" y="-10" width="100" height="20" rx="5" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="18" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#cbd5e1" font-weight="600">Tech #08: Rahul (Idle)</text>
    </g>

    <!-- Map Floating Mini Legend -->
    <g transform="translate(14, 260)">
      <rect width="180" height="34" rx="8" fill="rgba(10, 14, 26, 0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#38bdf8"/>
      <text x="26" y="20" font-family="sans-serif" font-size="9" fill="#94a3b8">In Transit (18)</text>
      <circle cx="95" cy="17" r="4" fill="#10b981"/>
      <text x="105" y="20" font-family="sans-serif" font-size="9" fill="#94a3b8">Active Job (26)</text>
    </g>
  </g>

  <!-- Right Work Area: Live Dispatch & Work Orders (260px wide) -->
  <g transform="translate(525, 128)">
    <rect width="260" height="305" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#fff" font-weight="700">Live Work Orders &amp; Invoices</text>
    
    <!-- Order Card 1 -->
    <g transform="translate(12, 42)">
      <rect width="236" height="74" rx="8" fill="rgba(10, 14, 26, 0.6)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="10" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" fill="#38bdf8" font-weight="700">#WO-9842 • HVAC REPAIR</text>
      <rect x="165" y="8" width="62" height="16" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="196" y="19" font-family="sans-serif" font-size="8" fill="#38bdf8" font-weight="700" text-anchor="middle">DISPATCHED</text>
      
      <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc" font-weight="600">Apex Commercial Towers</text>
      <text x="10" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94a3b8">Assigned: Tech Vikram • ETA 14m</text>
      
      <rect x="10" y="58" width="216" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
      <rect x="10" y="58" width="140" height="4" rx="2" fill="#38bdf8"/>
    </g>

    <!-- Order Card 2 -->
    <g transform="translate(12, 126)">
      <rect width="236" height="74" rx="8" fill="rgba(10, 14, 26, 0.6)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <text x="10" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" fill="#10b981" font-weight="700">#WO-9839 • ELEVATOR SENSOR</text>
      <rect x="165" y="8" width="62" height="16" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="196" y="19" font-family="sans-serif" font-size="8" fill="#34d399" font-weight="700" text-anchor="middle">RESOLVED</text>
      
      <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc" font-weight="600">Grand Hyatt Residences</text>
      <text x="10" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94a3b8">Digital Sign-off &amp; Invoiced ₹14,200</text>
      
      <rect x="10" y="58" width="216" height="4" rx="2" fill="#10b981"/>
    </g>

    <!-- Order Card 3 (Mobile Geofence Punch-in) -->
    <g transform="translate(12, 210)">
      <rect width="236" height="82" rx="8" fill="rgba(10, 14, 26, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="10" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" fill="#fbbf24" font-weight="700">ANDROID GEOFENCE SYNC</text>
      <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc" font-weight="600">Mobile Attendance Verified</text>
      <text x="10" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">48 Technicians punched in on-site</text>
      
      <g transform="translate(10, 60)">
        <rect width="95" height="16" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
        <text x="47" y="11" font-family="sans-serif" font-size="8" fill="#38bdf8" text-anchor="middle">GPS Verified</text>
        
        <rect x="105" y="0" width="110" height="16" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="160" y="11" font-family="sans-serif" font-size="8" fill="#34d399" text-anchor="middle">Auto-Invoice Ready</text>
      </g>
    </g>
  </g>
</svg>

