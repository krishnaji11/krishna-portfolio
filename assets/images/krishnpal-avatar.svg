<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="avatarGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#d99970"/>
      <stop offset="60%" stop-color="#ba7a54"/>
      <stop offset="100%" stop-color="#935b39"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222634"/>
      <stop offset="100%" stop-color="#0f1118"/>
    </linearGradient>
    <linearGradient id="blazerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>
    <linearGradient id="glassesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>
  
  <!-- Cyber Ambient Glow -->
  <circle cx="200" cy="180" r="160" fill="url(#avatarGlow)"/>

  <!-- Cyber Grid Pattern in Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.8">
    <line x1="80" y1="80" x2="320" y2="80"/>
    <line x1="60" y1="140" x2="340" y2="140"/>
    <line x1="60" y1="200" x2="340" y2="200"/>
    <line x1="80" y1="260" x2="320" y2="260"/>
    <line x1="120" y1="40" x2="120" y2="360"/>
    <line x1="200" y1="40" x2="200" y2="360"/>
    <line x1="280" y1="40" x2="280" y2="360"/>
  </g>

  <!-- Glowing Outer Neon Ring -->
  <circle cx="200" cy="200" r="192" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.85" filter="url(#neonGlow)"/>
  <circle cx="200" cy="200" r="192" fill="none" stroke="url(#ringGrad)" stroke-width="2"/>

  <!-- Portrait Illustration -->
  <g filter="url(#softShadow)">
    
    <!-- Torso / Smart Navy Blazer & Shirt -->
    <!-- Inner Dark T-shirt -->
    <path d="M155,270 L245,270 L255,400 L145,400 Z" fill="url(#shirtGrad)"/>
    <!-- V-Neck cut -->
    <path d="M175,270 Q200,305 225,270 L220,330 Q200,345 180,330 Z" fill="#090d16"/>

    <!-- Blazer Left Lapel / Shoulder -->
    <path d="M60,400 L95,300 Q130,265 170,270 L195,360 Q180,390 150,400 Z" fill="url(#blazerGrad)" stroke="#334155" stroke-width="0.7"/>
    <!-- Blazer Right Lapel / Shoulder -->
    <path d="M340,400 L305,300 Q270,265 230,270 L205,360 Q220,390 250,400 Z" fill="url(#blazerGrad)" stroke="#334155" stroke-width="0.7"/>

    <!-- Subtle Cyan Accent Pocket / Lapel Pin -->
    <rect x="110" y="340" width="16" height="3" rx="1.5" fill="#38bdf8" opacity="0.9" filter="url(#neonGlow)"/>

    <!-- Neck -->
    <path d="M175,230 L225,230 L230,280 Q200,290 170,280 Z" fill="url(#skinGrad)"/>
    <!-- Neck shadow under chin -->
    <path d="M175,230 Q200,250 225,230 Q200,240 175,230 Z" fill="#754528" opacity="0.5"/>

    <!-- Head & Face Base -->
    <ellipse cx="200" cy="190" rx="58" ry="70" fill="url(#skinGrad)"/>

    <!-- Ears -->
    <ellipse cx="140" cy="192" rx="10" ry="16" fill="url(#skinGrad)"/>
    <ellipse cx="260" cy="192" rx="10" ry="16" fill="url(#skinGrad)"/>
    <ellipse cx="140" cy="192" rx="6" ry="10" fill="#935b39" opacity="0.5"/>
    <ellipse cx="260" cy="192" rx="6" ry="10" fill="#935b39" opacity="0.5"/>

    <!-- Hair (Modern sleek pompadour/fade, dark textured) -->
    <path d="M138,175 C135,135 155,105 200,105 C245,105 265,135 262,175 C255,150 240,125 200,125 C160,125 145,150 138,175 Z" fill="url(#hairGrad)"/>
    <path d="M142,165 C146,130 168,110 200,110 C235,110 258,132 258,165 C252,145 235,132 200,132 C165,132 148,145 142,165 Z" fill="#2d3345" opacity="0.8"/>
    <!-- Sideburns -->
    <path d="M140,165 L144,200 L148,198 L146,165 Z" fill="url(#hairGrad)"/>
    <path d="M260,165 L256,200 L252,198 L254,165 Z" fill="url(#hairGrad)"/>

    <!-- Well-groomed Stubble / Beard -->
    <path d="M152,205 C155,245 175,262 200,262 C225,262 245,245 248,205 C242,225 225,250 200,250 C175,250 158,225 152,205 Z" fill="url(#hairGrad)" opacity="0.65"/>
    <path d="M185,225 C190,222 210,222 215,225 C210,230 190,230 185,225 Z" fill="url(#hairGrad)" opacity="0.6"/> <!-- Mustache -->

    <!-- Eyebrows -->
    <path d="M162,168 Q178,162 192,166" stroke="#181c26" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M238,168 Q222,162 208,166" stroke="#181c26" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Modern Tech Glasses Frame (Matte Charcoal with Cyan Reflective Edge) -->
    <rect x="156" y="172" width="36" height="24" rx="7" fill="rgba(15, 23, 42, 0.4)" stroke="url(#glassesGrad)" stroke-width="2.5"/>
    <rect x="208" y="172" width="36" height="24" rx="7" fill="rgba(15, 23, 42, 0.4)" stroke="url(#glassesGrad)" stroke-width="2.5"/>
    <!-- Bridge -->
    <path d="M192,180 Q200,177 208,180" stroke="url(#glassesGrad)" stroke-width="2.5" fill="none"/>
    <!-- Lens Specular Glint -->
    <line x1="162" y1="178" x2="175" y2="191" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
    <line x1="214" y1="178" x2="227" y2="191" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

    <!-- Eyes (Behind glass) -->
    <circle cx="174" cy="184" r="5" fill="#181c26"/>
    <circle cx="226" cy="184" r="5" fill="#181c26"/>
    <circle cx="176" cy="182" r="1.5" fill="#ffffff"/>
    <circle cx="228" cy="182" r="1.5" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M200,183 L197,205 Q200,208 205,205" stroke="#754528" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Confident Warm Smile -->
    <path d="M182,226 Q200,238 218,226" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M180,225 Q200,242 220,225" stroke="#754528" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Live Status Badge / Pill Attached to Bottom Right -->
  <g transform="translate(265, 305)">
    <rect x="0" y="0" width="115" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="17" cy="17" r="5" fill="#10b981" filter="url(#neonGlow)"/>
    <circle cx="17" cy="17" r="5" fill="#34d399"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="0.5">AVAILABLE</text>
  </g>

  <!-- Senior AI & PHP Badge on Bottom Left -->
  <g transform="translate(20, 305)">
    <rect x="0" y="0" width="105" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.5">8+ YRS EXP</text>
  </g>
</svg>

